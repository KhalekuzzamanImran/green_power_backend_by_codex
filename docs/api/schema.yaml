        * `APARTMENT_FLOOR_WISE` - Apartment Floor Wise
        * `INDUSTRY_MAIN` - Industry Main
        * `INDUSTRY_ZONING` - Industry Zoning
        * `INDUSTRY_BOARD` - Industry Board
        * `INDUSTRY_MD_CEO` - Industry MD/CEO
        * `INDUSTRY_OWNER` - Industry Owner
