{% extends "panel/base.html" %}
{% block content %}
  <section class="panel-section panel-section-clients">
    <div class="panel-section-header">
      <h2>Accessible Clients</h2>
      {% if request.user.role == "ADMIN" %}
        <a class="panel-button panel-button-link" href="{% url 'panel:client-add' %}">Add Client</a>
      {% endif %}
    </div>
    <form method="get" class="panel-form-grid" data-live-filter-form data-live-filter-target="#clients-results" data-live-filter-partial="clients-results">
      <div class="panel-form-row">
        <label for="client-type-filter">Client Type</label>
        <select id="client-type-filter" name="client_type" data-auto-submit-immediate>
          <option value="">All client types</option>
          {% for client_type in client_types %}
            <option value="{{ client_type.id }}" {% if selected_client_type == client_type.id|stringformat:"s" %}selected{% endif %}>
              {{ client_type.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="panel-form-row">
        <label for="client-scope-filter">Scope</label>
        <select id="client-scope-filter" name="scope" data-auto-submit-immediate>
          <option value="">All scopes</option>
          {% for scope in dashboard_scopes %}
            <option value="{{ scope.id }}" {% if selected_scope == scope.id|stringformat:"s" %}selected{% endif %}>
              {{ scope.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="panel-form-row">
        <label for="client-search-filter">Search</label>
        <input id="client-search-filter" type="text" name="q" value="{{ search_query }}" placeholder="Search by company / site name or code" data-auto-submit-debounce="250">
      </div>
      <div class="panel-inline-form-actions">
        <a class="panel-button panel-button-secondary panel-button-link" href="{% url 'panel:clients' %}">Reset</a>
      </div>
    </form>
    <div id="clients-results" class="panel-results-region">
      {% include "panel/clients/partials/results.html" %}
    </div>
  </section>
{% endblock %}
