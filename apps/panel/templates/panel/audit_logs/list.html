{% extends "panel/base.html" %}
{% block content %}
  <section class="panel-section panel-section-managed">
    <h2>Audit Logs</h2>
    <table class="panel-table">
      <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Description</th></tr></thead>
      <tbody>
        {% for log in audit_logs %}
          <tr>
            <td>{{ log.created_at }}</td>
            <td>{{ log.actor|default:"-" }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.target_type }}</td>
            <td>{{ log.description }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
{% endblock %}
