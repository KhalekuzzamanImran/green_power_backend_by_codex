{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Login | Green Power EMS</title>
  <link rel="stylesheet" href="{% static 'panel/css/panel.css' %}">
</head>
<body class="panel-login-body">
  <div class="panel-login-card">
    <h1>Green Power EMS Panel</h1>
    <p>Sign in with your existing user account.</p>
    <form method="post" class="panel-form-stack">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label>
        Username
        {{ form.username }}
      </label>
      <label>
        Password
        {{ form.password }}
      </label>
      <button class="panel-button" type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
